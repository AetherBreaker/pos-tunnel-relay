[project]
  name            = "pos-tunnel-relay"
  version         = "0.1.0"
  description     = "The pos-tunnel relay: sshd plus a daemon that owns POS leases, enforcement and logging"
  readme          = "README.md"
  requires-python = ">=3.14"
  # devkit-container 2.2 is the first with [tool.docker].daemons; setup-project keeps raising the floor.
  dependencies    = ["aeth-ext>=9.0.2", "devkit-container>=2.2.0"]

  [project.scripts]
    relay-killer             = "pos_tunnel_relay.killer:main"
    relay-startup            = "pos_tunnel_relay.startup:main"
    run-app-pos-tunnel-relay = "pos_tunnel_relay.__main__:run_app"
    tunnel-keys              = "pos_tunnel_relay.client:tunnel_keys"
    tunnelctl                = "pos_tunnel_relay.client:tunnelctl"

[dependency-groups]
  dev       = ["aeth-devkit>=15.1.1", "devkit-claude-hooks>=1.0.1", "devkit-poe-complete>=1.1.0", "devkit-templates>=1.3.0", "poethepoet>=0.46.0", "pyright>=1.1.411", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.15", "tombi>=1.5"]  # setup-project added: "devkit-claude-hooks", "devkit-poe-complete", "poethepoet>=0.46.0", "pyright>=1.1.411", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.15", "tombi>=1.5"
  # The central log server the Docker tests run (tests/integration/logserver.Dockerfile).
  logserver = ["aeth-ext[logserver]>=9.0.2"]

[build-system]
  requires      = ["uv_build>=0.11.2,<0.12.0"]
  build-backend = "uv_build"

[tool.coverage]
  [tool.coverage.run]
    data_file   = ".cache/.coverage"
    source_pkgs = ["pos_tunnel_relay"]

  [tool.coverage.report]
    show_missing = true

  [tool.coverage.html]
    directory = ".cache/htmlcov"

  [tool.coverage.xml]
    output = ".cache/coverage.xml"

  [tool.coverage.lcov]
    output = ".cache/coverage.lcov"

[tool.docker]
  services                = ["pos-tunnel-relay"]
  required_persisted_dirs = ["persisted_data"]
  # `daemons` implies it; written out so setup-project doesn't insert its `supervise = false` default.
  supervise               = true
  wireguard               = false
  startup_scripts         = ["relay-startup"]
  # Root, started after relay-startup, beside the daemon; the run ends if either exits (design 6.1).
  # sshd blocks opening its log, the FIFO relay-startup creates, until the daemon opens it (design 6.3).
  daemons                 = [["/usr/sbin/sshd", "-D", "-E", "/run/pos-tunnel/sshd.log"], ["/usr/sbin/cron", "-f"]]
  scrub_env               = ["RELAY_SSH_PRIVATE_KEY", "OPERATOR_KEYS"]

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

[tool.pyright]
  # Linux-only code (FIFOs, SO_PEERCRED, /proc); type-check it as such on every host.
  pythonPlatform   = "Linux"
  typeCheckingMode = "standard"

  verboseOutput          = true
  useLibraryCodeForTypes = true

  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true
  deprecateTypingAliases      = true

  reportPropertyTypeMismatch          = true
  reportMissingTypeStubs              = false
  reportImportCycles                  = true
  reportUntypedFunctionDecorator      = true
  reportUntypedClassDecorator         = true
  reportUntypedNamedTuple             = true
  reportPrivateUsage                  = true
  # reportConstantRedefinition          = true
  reportDeprecated                    = true
  # reportMissingSuperCall              = true
  reportUninitializedInstanceVariable = true
  reportMissingParameterType          = true
  # reportMissingTypeArgument           = true
  reportUnnecessaryIsInstance         = true
  reportUnnecessaryCast               = true
  reportUnnecessaryComparison         = true
  reportUnnecessaryContains           = true
  reportInvalidStubStatement          = true
  reportUnnecessaryTypeIgnoreComment  = true
  reportMatchNotExhaustive            = true
  reportUnreachable                   = true
  reportImplicitOverride              = true
  reportMissingTypeArgument           = false

  executionEnvironments = [{ root = "src", extraPaths = ["src"] }]

[tool.pytest.ini_options]
  addopts      = [
    "--cov",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-ra",
  ]
  cache_dir    = ".cache/pytest"
  testpaths    = ["tests"]
  xfail_strict = true
  asyncio_mode = "auto"

[tool.ruff]
  cache-dir = ".cache/ruff"
  # Sister projects' packages count as first-party (ruff `src` supports globs).
  src       = ["./src", "../*/src", "../*/python"]

  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv",
  ]

  fix = true

  indent-width = 2
  line-length  = 135

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    extend-select = [
      "A",
      "ANN001",
      "ASYNC",
      "B",
      "C4",
      "C90",
      "D",
      "DTZ",
      "FBT003",
      "LOG",
      "N",
      "NPY",
      "PD",
      "PERF",
      "PL",
      "PYI",
      "RUF",
      "T10",
      "TC",
      "TID",
      "UP",
    ]
    ignore        = [
      "A004",
      "PD008",
      "PD009",
      "PLC0415",
      "PLR0913",
      "PLW0603",
      "PIE790",
    ]

    [tool.ruff.lint.flake8-tidy-imports.banned-api]
      # Delivered by ruff exactly when violated, so the reasoning costs no context otherwise.
      "__future__.annotations".msg = "Python 3.14 evaluates all annotations lazily (PEP 649) with or without this import. What it adds is PEP 563 stringification, which breaks pydantic, dataclasses.fields() introspection, and typing.get_type_hints."

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.per-file-ignores]
      # No missing-docstring rules in tests: a test's name is its summary, and test docstrings
      # read to agents as statements of intent that were never reviewed. D2xx+ still apply to
      # docstrings a test does have.
      "tests/**" = ["D1"]

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["pos_tunnel_relay"]
      # Installed from the index, never a sibling checkout: CI has no ../aeth_ext/src, so both
      # environments must sort it the same way.
      known-third-party  = ["aeth_ext"]

      [tool.ruff.lint.isort.import-heading]
        first-party      = "First party imports"
        future           = "Future imports"
        local-folder     = "Local folder imports"
        standard-library = "Standard library imports"
        third-party      = "Third party imports"

[tool.tombi]
  toml-version = "v1.1.0"

  [tool.tombi.files]
    exclude = [
      ".bzr",
      ".direnv",
      ".eggs",
      ".git",
      ".git-rewrite",
      ".hg",
      ".mypy_cache",
      ".nox",
      ".pants.d",
      ".pytype",
      ".ruff_cache",
      ".svn",
      ".tox",
      ".venv",
      "__pypackages__",
      "_build",
      "buck-out",
      "dist",
      "node_modules",
      "venv",
    ]

  [tool.tombi.format.rules]
    indent-sub-tables               = true
    indent-table-key-value-pairs    = true
    key-value-equals-sign-alignment = true
    trailing-comment-alignment      = true

[tool.uv]
  # aeth-ext[logserver] resolves only for these (textual-web pins an old uvloop on other platforms), as in aeth_ext itself.
  environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

  [tool.uv.sources]
    aeth-devkit         = [{ index = "SFTPyPI" }]
    devkit-templates    = [{ index = "SFTPyPI" }]
    devkit-container    = [{ index = "SFTPyPI" }]
    devkit-claude-hooks = [{ index = "SFTPyPI" }]
    devkit-poe-complete = [{ index = "SFTPyPI" }]
    aeth-ext            = [{ index = "SFTPyPI" }]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
